# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: CSharp
on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: "csharp-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: true
jobs:
  paths-filter:
    runs-on: depot-ubuntu-24.04-arm-small
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        with:
          filters: |
            changed:
              - '.github/workflows/csharp.yaml'
              - 'Magefile.go'
              - 'go.mod'
              - 'go.sum'
              - 'proto-clients/spicedb-csharp-proto/**'
              - 'spicedb-csharp/**'

  lint:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Held at v5 deliberately. setup-go v6+ defaults GOTOOLCHAIN=local, so Go
      # stops fetching the toolchain go.mod asks for and every job that needs a
      # newer one dies with "go.mod requires go >= 1.25.7 (running go 1.24.13;
      # GOTOOLCHAIN=local)". Moving to v6/v7 needs explicit toolchain handling,
      # which is its own change rather than a dependency bump.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install mage
        timeout-minutes: 5
        run: go install github.com/magefile/mage@latest
      - name: Lint
        run: mage -d spicedb-csharp lint

  unit:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install mage
        timeout-minutes: 5
        run: go install github.com/magefile/mage@latest
      - name: Proto client tests
        run: mage -d proto-clients/spicedb-csharp-proto test
      - name: Idiomatic client tests
        run: mage -d spicedb-csharp test
      # Kept as its own step so a network outage stays distinguishable from a TLS
      # regression. `dotnet test --filter` reports success when the filter matches
      # nothing, so the grep for the pass line is what makes a renamed, deleted or
      # un-traited test fail here instead of going green. Root DESIGN.md, "RULE: A
      # system-TLS constructor must reach a real server", clause 3.
      - name: TLS handshake test (requires network)
        run: |
          output=$(dotnet test SpiceDB.Client.sln --filter "Category=TlsHandshake" --verbosity normal)
          echo "$output"
          echo "$output" | grep -qE "Passed: +1" || {
            echo "::error::handshake test did not run — was it renamed, removed or un-traited?"
            exit 1
          }
        working-directory: spicedb-csharp

  integration:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install mage
        timeout-minutes: 5
        run: go install github.com/magefile/mage@latest
      - name: Integration test
        run: mage -d spicedb-csharp integrationTest

  apicompat:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true' && github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04-arm-small
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install mage
        timeout-minutes: 5
        run: go install github.com/magefile/mage@latest
      - name: Install Microsoft.DotNet.ApiCompat.Tool
        timeout-minutes: 5
        run: dotnet tool install --global Microsoft.DotNet.ApiCompat.Tool
      # A deliberate break is acknowledged by labelling the PR
      # `breaking-change-acknowledged`, which skips this step. The label is
      # deliberately per-PR and visible on the PR itself: an intentional break
      # should be a decision someone took and left a record of, not a silent
      # config toggle. Removing the label re-runs the check.
      #
      # The skip is total, not selective -- mage returns 1 both for findings
      # and for its own failures, so this cannot suppress only the former. A
      # labelled PR therefore also loses the signal that the check itself
      # broke, which is the cost of keeping the mechanism this simple.
      - name: API compatibility check
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change-acknowledged') }}
        run: mage -d spicedb-csharp apiCompat origin/${{ github.base_ref }}
      - name: API compatibility check skipped
        if: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-acknowledged') }}
        run: |
          echo "::notice::API compatibility check skipped: this PR is labelled breaking-change-acknowledged."
