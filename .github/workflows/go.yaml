# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: "go-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: true
jobs:
  paths-filter:
    runs-on: depot-ubuntu-24.04-arm-small
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        with:
          filters: |
            changed:
              - '.github/workflows/go.yaml'
              - 'Magefile.go'
              - 'go.mod'
              - 'go.sum'
              - 'proto-clients/spicedb-go-proto/**'
              - 'spicedb-go/**'

  lint:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Held at v5 deliberately. setup-go v6+ defaults GOTOOLCHAIN=local, so Go
      # stops fetching the toolchain go.mod asks for and every job that needs a
      # newer one dies with "go.mod requires go >= 1.25.7 (running go 1.24.13;
      # GOTOOLCHAIN=local)". Moving to v6/v7 needs explicit toolchain handling,
      # which is its own change rather than a dependency bump.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # golangci-lint v2, pinned explicitly. The action was previously v6, which
      # installs golangci-lint v1.64.x -- built with Go 1.24, and it refuses a newer
      # target outright: "the Go language version (go1.24) used to build
      # golangci-lint is lower than the targeted Go version". The modules here are on
      # Go 1.26.5, so the linter has to keep up, and the version is pinned rather than
      # left to the action's default so a default change cannot reintroduce that.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: spicedb-go
          version: v2.11.3
      - name: Install mage
        timeout-minutes: 5
        run: go install github.com/magefile/mage@latest
      - name: Lint
        run: mage -d spicedb-go lint

  unit:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install mage
        timeout-minutes: 5
        run: go install github.com/magefile/mage@latest
      - name: Proto client tests
        run: mage -d proto-clients/spicedb-go-proto test
      - name: Idiomatic client tests
        run: mage -d spicedb-go test
      # Kept as its own step so a network outage stays distinguishable from a TLS
      # regression. `go test -run` exits 0 when the name filter matches nothing, and a
      # gated test that skips also exits 0, so the grep for the PASS line is what makes
      # a renamed, deleted or silently-skipped test fail here instead of going green.
      # Root DESIGN.md, "RULE: A system-TLS constructor must reach a real server",
      # clause 3.
      - name: TLS handshake test (requires network)
        env:
          SPICEDB_TLS_INTEGRATION: "1"
        run: |
          output=$(go test ./client/ -run '^TestNewSystemTLS_CompletesRealHandshake$' -v)
          echo "$output"
          echo "$output" | grep -q -- "--- PASS: TestNewSystemTLS_CompletesRealHandshake" || {
            echo "::error::handshake test did not run — was it renamed, removed or skipped?"
            exit 1
          }
        working-directory: spicedb-go

  integration:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install mage
        timeout-minutes: 5
        run: go install github.com/magefile/mage@latest
      - name: Integration test
        run: mage -d spicedb-go integrationTest

  apicompat:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true' && github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04-arm-small
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install mage
        timeout-minutes: 5
        run: go install github.com/magefile/mage@latest
      - name: Install go-apidiff
        timeout-minutes: 5
        run: go install github.com/joelanford/go-apidiff@latest
      - name: API compatibility check
        run: mage -d spicedb-go apiCompat origin/${{ github.base_ref }}
