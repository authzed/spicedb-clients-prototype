# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Meta
on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: "meta-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: true
jobs:
  yaml-lint:
    runs-on: depot-ubuntu-24.04-arm-small
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        run: pip3 install yamllint
      - name: Lint workflow YAML
        run: "yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .github/workflows/"

  markdown-lint:
    runs-on: depot-ubuntu-24.04-arm-small
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install markdownlint-cli2
        timeout-minutes: 5
        run: npm install -g markdownlint-cli2
      - name: Lint Markdown
        run: markdownlint-cli2

  gen-nodiff:
    runs-on: depot-ubuntu-24.04-arm-8
    # No job may sit at GitHub's 360-minute default: a hung step should
    # fail fast and free the runner. The slowest job here runs well under
    # five minutes, so this is a backstop, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Held at v5 deliberately. setup-go v6+ defaults GOTOOLCHAIN=local, so Go
      # stops fetching the toolchain go.mod asks for and every job that needs a
      # newer one dies with "go.mod requires go >= 1.25.7 (running go 1.24.13;
      # GOTOOLCHAIN=local)". Moving to v6/v7 needs explicit toolchain handling,
      # which is its own change rather than a dependency bump.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: spicedb-ruby
      - name: Install Ruby deps
        working-directory: spicedb-ruby
        run: bundle install
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: spicedb-rust
      - name: Install protoc
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
      - name: Install mage
        timeout-minutes: 5
        run: go install github.com/magefile/mage@latest
      # ./... rather than . -- the root package holds the mage helpers, but the
      # root module also holds internal/clauderun and internal/apicompat, whose
      # tests no other workflow runs: the go.yaml lint and unit jobs are scoped
      # to the spicedb-go module. With a bare `.` those packages compiled in CI
      # but were never tested.
      - name: Test mage helpers and internal packages
        run: go test -tags mage ./...
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build proto package
        run: pnpm --filter @spicedb/proto build
      - name: Generate all clients
        run: mage gen:all
      - name: Fail if generated files drifted
        uses: chainguard-dev/actions/nodiff@0ffab11a71c1b7bd68ddf94665a8ec88b116223d # main
        with:
          path: ""
          fixup-command: mage gen:all
