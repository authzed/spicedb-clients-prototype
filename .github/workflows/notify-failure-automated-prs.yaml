# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Notify on Failure for Automated PRs
on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]
permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: read
  statuses: read
# Scoped by the triggering LABEL — or, for the non-`labeled` events, by the
# action name — as well as by PR number, deliberately. On a partial
# regeneration the companion workflow applies two labels at once
# (`automated,regen-partial`), and GitHub fires one `labeled` event per label,
# so two runs of this workflow are created seconds apart. Workflow-level
# concurrency is evaluated at run-admission time, BEFORE the job-level `if:`
# is considered — so with a PR-number-only group the `regen-partial` run would
# enter the same group, cancel the still-watching `automated` run via
# cancel-in-progress, and then skip its own job. The watch would die and no
# Slack alert would ever fire, on exactly the partial-regeneration PRs that
# most need a human. Including the label name makes that collision
# structurally impossible.
#
# `synchronize` and `ready_for_review` carry no `github.event.label`, so they
# fall back to the action name. That keeps each event class in its own group:
# a fresh push (`synchronize`) supersedes only the previous run watching that
# same push, and never cancels a `labeled` run that is still watching.
concurrency:
  group: "notify-automated-${{ github.event.pull_request.number }}-${{ github.event.label.name || github.event.action }}"
  cancel-in-progress: true
jobs:
  notify:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'automated')
      || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'automated'))
    runs-on: depot-ubuntu-24.04-arm-small
    # Long enough to outlast the slowest per-language integration suite, short
    # enough that a hung watch frees the runner rather than sitting at the
    # 360-minute default.
    timeout-minutes: 90
    steps:
      # This job only watches; it deliberately does not hold the Claude
      # credential or the arm-8 runner that regen-from-api.yaml uses.
      - name: Wait for all required checks to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          if out=$(gh pr checks --required --watch --interval 10 --fail-fast "$PR" --repo "$GITHUB_REPOSITORY" 2>&1); then
            printf '%s\n' "$out"
            exit 0
          fi
          printf '%s\n' "$out"
          case "$out" in
            *"no required checks"*)
              echo "::warning::No required checks are configured on this repository, so there is nothing to watch. Configure them before relying on this alert."
              exit 0
              ;;
          esac
          exit 1

      - name: Notify in Slack if failure
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_BUILDS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Required checks failed on an automated PR"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |
                    :x: Required checks failed on an automated client regeneration PR, or the watch could not complete.
                    *Repository:* <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>
                    *PR:* <${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}>
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>
