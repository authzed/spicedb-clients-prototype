# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Ruby
on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: "ruby-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: true
jobs:
  paths-filter:
    runs-on: depot-ubuntu-24.04-arm-small
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        with:
          filters: |
            changed:
              - '.github/workflows/ruby.yaml'
              - 'Magefile.go'
              - 'go.mod'
              - 'go.sum'
              - 'proto-clients/spicedb-ruby-proto/**'
              - 'spicedb-ruby/**'

  lint:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: spicedb-ruby
      - name: Install Ruby deps
        working-directory: spicedb-ruby
        run: bundle install
      - name: Install mage
        run: go install github.com/magefile/mage@latest
      - name: Lint
        run: mage -d spicedb-ruby lint

  unit:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: spicedb-ruby
      - name: Install Ruby deps (idiomatic client)
        working-directory: spicedb-ruby
        run: bundle install
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: proto-clients/spicedb-ruby-proto
      - name: Install Ruby deps (proto client)
        working-directory: proto-clients/spicedb-ruby-proto
        run: bundle install
      - name: Install mage
        run: go install github.com/magefile/mage@latest
      - name: Proto client tests
        run: mage -d proto-clients/spicedb-ruby-proto test
      - name: Idiomatic client tests
        run: mage -d spicedb-ruby test

  integration:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: spicedb-ruby
      - name: Install Ruby deps (idiomatic client)
        working-directory: spicedb-ruby
        run: bundle install
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: proto-clients/spicedb-ruby-proto
      - name: Install Ruby deps (proto client)
        working-directory: proto-clients/spicedb-ruby-proto
        run: bundle install
      - name: Install mage
        run: go install github.com/magefile/mage@latest
      - name: Integration test
        run: mage -d spicedb-ruby integrationTest
