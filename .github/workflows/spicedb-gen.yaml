# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: spicedb-gen
on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: "spicedb-gen-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: true
jobs:
  paths-filter:
    runs-on: depot-ubuntu-24.04-arm-small
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          # The entries below 'spicedb-gen/**' are NOT unrelated -- do not remove them.
          # spicedb-gen's templates emit code that imports these client packages, and every
          # testdata project builds against the live in-repo sources (testdata/go's go.mod
          # `replace`, testdata/typescript's `workspace:*`, testdata/python's
          # `[tool.uv.sources] path`, testdata/java's `includeBuild`). So a signature change
          # in one of them can break generation without touching spicedb-gen/** at all, and
          # with a filter watching only spicedb-gen/** every job here would skip and report
          # green.
          #
          # That is not hypothetical. Task 3 of the group-B fix wave (f9e039c) changed
          # rel.Txn's Create/Touch/Delete to return error, touching spicedb-go/rel/rel.go and
          # spicedb-go/client/bulk.go. The Go template kept calling them in statement
          # position, where Go permits discarding a return value, so the generated typed
          # client silently dropped caveat-context conversion errors. Every job here skipped,
          # and only a human reading the template caught it (finding F4, fixed in cde3836).
          #
          # Note the filter is necessary but not sufficient: the defect still COMPILED, so a
          # build alone would not have failed. What fails is
          # TestWriteMethodsPropagateTxnErrors in spicedb-gen/golang/generator_test.go, added
          # with the F4 fix -- and it only runs if this filter matches. Keep both.
          #
          # Scoped to the packages the templates actually import, deliberately -- a blanket
          # 'spicedb-*/**' would run this suite on every client change and the noise would get
          # the whole filter reverted.
          filters: |
            changed:
              - '.github/workflows/spicedb-gen.yaml'
              - 'Magefile.go'
              - 'go.mod'
              - 'go.sum'
              - 'spicedb-gen/**'
              # Go template: imports spicedb-go/{client,consistency,rel}
              - 'spicedb-go/client/**'
              - 'spicedb-go/consistency/**'
              - 'spicedb-go/rel/**'
              # TypeScript template: imports "@spicedb/client" (pnpm workspace -> spicedb-typescript)
              - 'spicedb-typescript/src/**'
              # Python templates: import spicedb, spicedb.consistency, spicedb.sync, spicedb.aio
              - 'spicedb-python/spicedb/**'
              # Java template: imports com.authzed.spicedb.*
              - 'spicedb-java/lib/src/main/java/**'

  test:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mage
        run: go install github.com/magefile/mage@latest
      - name: Unit tests
        run: mage -d spicedb-gen test

  go-int:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mage
        run: go install github.com/magefile/mage@latest
      - name: Go integration test
        run: mage -d spicedb-gen goIntegrationTest

  ts-int:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install mage
        run: go install github.com/magefile/mage@latest
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build proto package
        run: pnpm --filter @spicedb/proto build
      - name: Build client package
        run: pnpm --filter @spicedb/client build
      - name: TypeScript integration test
        run: mage -d spicedb-gen typeScriptIntegrationTest

  java-int:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Install mage
        run: go install github.com/magefile/mage@latest
      - name: Java integration test
        run: mage -d spicedb-gen javaIntegrationTest

  python-int:
    needs: paths-filter
    if: needs.paths-filter.outputs.changed == 'true'
    runs-on: depot-ubuntu-24.04-arm-4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - name: Install mage
        run: go install github.com/magefile/mage@latest
      - name: Install pyright (positive + expected-failure checks)
        run: uv tool install pyright
      - name: Python integration test
        run: mage -d spicedb-gen pythonIntegrationTest
