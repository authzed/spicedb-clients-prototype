config:
  MD012: false
  MD024:
    siblings_only: true
  MD013: false
  MD031: false
  MD032: false
  MD033: false
  MD040: false
  MD041: false
  MD060: false
globs:
  - "**/*.md"
ignores:
  - "**/node_modules/**"
  - "**/target/**"
  - "**/.venv/**"
  - "**/build/**"
  - "docs/superpowers/**"
  # Agent working directories. Neither is tracked, so neither exists in a CI
  # checkout -- but both exist locally, and without these the repo-wide gate
  # reports over a thousand violations that can never reach the repository.
  - "**/.superpowers/**"
  - "**/.claude/**"
  - "proto-clients/**"
  - "spicedb-rust/target/**"
