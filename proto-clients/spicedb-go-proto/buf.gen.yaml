version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      module: buf.build/authzed/api
      value: github.com/authzed/spicedb-clients/proto-clients/spicedb-go-proto/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen
    opt:
      - paths=source_relative
inputs:
  - module: buf.build/authzed/api
