version: v2
managed:
  enabled: true
  # Only go_package is rewritten, and with an explicit package name, so the
  # generated packages are named v1/v0 exactly like authzed-go's and the
  # embedded descriptors keep every other upstream file option unchanged.
  disable:
    - file_option: java_package
    - file_option: java_outer_classname
    - file_option: java_multiple_files
    - file_option: java_string_check_utf8
    - file_option: objc_class_prefix
    - file_option: csharp_namespace
    - file_option: php_namespace
    - file_option: php_metadata_namespace
    - file_option: ruby_package
    - file_option: cc_enable_arenas
    - file_option: optimize_for
    - module: buf.build/googleapis/googleapis
    - module: buf.build/envoyproxy/protoc-gen-validate
    - module: buf.build/grpc-ecosystem/grpc-gateway
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package
      path: authzed/api/v1
      value: github.com/authzed/spicedb-clients/proto-clients/spicedb-go-proto/gen/authzed/api/v1;v1
    - file_option: go_package
      path: authzed/api/materialize/v0
      value: github.com/authzed/spicedb-clients/proto-clients/spicedb-go-proto/gen/authzed/api/materialize/v0;v0
# This tier is the canonical Go binding for authzed.api.* (root DESIGN.md, "Be
# the single copy of the protocol bindings in any process"), so it emits
# everything authzed-go emits on those message types: fast-path vtproto
# methods, protoc-gen-validate methods and grpc-gateway handlers. authzed-go
# re-exports these packages through the alias bridge in cmd/authzed-go-bridge.
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/community/planetscale-vtprotobuf
    out: gen
    opt:
      - paths=source_relative
      - features=marshal+unmarshal+size+clone+equal
  - remote: buf.build/bufbuild/validate-go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway
    out: gen
    opt:
      - paths=source_relative
inputs:
  - module: buf.build/authzed/api
