[package]
name = "spicedb-proto"
version = "0.1.0"
edition = "2021"
description = "SpiceDB proto client for Rust — thin wrapper over tonic-generated gRPC stubs"

[dependencies]
tonic = { version = "0.12", features = ["channel", "tls"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tonic-build = "0.12"
glob = "0.3"
