[package]
name = "spicedb-proto"
version = "0.1.0"
edition = "2021"
description = "SpiceDB proto client for Rust — thin wrapper over tonic-generated gRPC stubs"

# Disable doctests: tonic-build generates doc comments containing JSON
# examples (e.g. `"reason": "ERROR_REASON_SCHEMA_PARSE_ERROR"`) that
# Rust's doctest runner tries to parse as Rust code and fails.
[lib]
doctest = false

[dependencies]
tonic = { version = "0.12", features = ["channel", "tls", "tls-native-roots"] }
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tonic-build = "0.14"
glob = "0.3"

[dev-dependencies]
# Only for the insecure-host-guard integration test's in-process capturing
# server (tests/client_test.rs) -- wraps a pre-bound TcpListener as the
# Stream tonic::transport::Server::serve_with_incoming expects, so the test
# can learn the ephemeral port before the server starts serving.
tokio-stream = "0.1"
