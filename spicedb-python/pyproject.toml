[project]
name = "spicedb-python"
version = "0.1.0"
description = "Idiomatic Python client for SpiceDB"
requires-python = ">=3.11"
dependencies = [
    "spicedb-python-proto",
    "grpcio>=1.71.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.uv.sources]
spicedb-python-proto = { path = "../proto-clients/spicedb-python-proto" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spicedb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running SpiceDB instance",
]
