[project]
name = "spicedb-python"
version = "0.1.0"
description = "Idiomatic Python client for SpiceDB"
requires-python = ">=3.11"
dependencies = [
    "spicedb-python-proto",
    "grpcio>=1.71.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.uv.sources]
spicedb-python-proto = { path = "../proto-clients/spicedb-python-proto" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spicedb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running SpiceDB instance",
]

[tool.ruff.lint]
# Pin the linter's intent explicitly to ruff's classic default rule set
# (pyflakes + a curated pycodestyle subset). Without this, `ruff check`'s
# selected rules vary with the installed ruff version — CI installs ruff
# unpinned, so a ruff release that widens the no-config default flips the
# lint gate red with no code change. Declaring the selection keeps the gate
# deterministic across ruff upgrades.
select = ["E4", "E7", "E9", "F"]
