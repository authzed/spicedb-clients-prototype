AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

# Relax metric thresholds for idiomatic client methods that are necessarily long
# (e.g. schema_diff_from_proto dispatches on many proto types).
Metrics/MethodLength:
  Max: 50

Metrics/BlockLength:
  Max: 200

Metrics/ModuleLength:
  Max: 200

# Lowered from 850: the caveat-context codec (check_context_to_struct,
# caveat_context_to_struct, check_context_value, caveat_context_value_from_proto,
# struct_to_caveat_context) moved out to SpiceDB::CaveatContext
# (caveat_context.rb), shrinking Client's actual class length to 800 lines.
# 810 leaves a small margin without re-inflating the ceiling this cop exists
# to enforce — do not raise this back toward 850 to make room for more
# private helpers; extract another module instead, the way this one was.
Metrics/ClassLength:
  Max: 810

Metrics/AbcSize:
  Max: 80

Metrics/CyclomaticComplexity:
  Max: 25

Metrics/PerceivedComplexity:
  Max: 25

Metrics/ParameterLists:
  Max: 10

# The SpiceDB module in errors.rb is intentionally minimal; top-level doc
# belongs in the main README / DESIGN.md rather than in code.
Style/Documentation:
  Enabled: false

# Method parameter 'd' in schema_diff_from_proto is clear from context.
Naming/MethodParameterName:
  MinNameLength: 1

# check_any/check_all are named for Boolean plurality semantics, not
# predicate convention — adding ? would be misleading.
Naming/PredicateMethod:
  Enabled: false

# CheckResult#has_permission? intentionally keeps the has_ prefix (rather
# than the bare `permission?` this cop prefers) to mirror the predicate name
# used across every other SpiceDB client library for this exact concept —
# cross-client consistency wins over this single-library style preference.
Naming/PredicatePrefix:
  AllowedMethods:
    - is_a?
    - has_permission?

# Line length limit — 120 is too tight for gRPC one-liners with optional chain.
Layout/LineLength:
  Max: 160

# Private visibility modifiers on constants are a no-op but harmless style
# choice; disable this warning.
Lint/UselessConstantScoping:
  Enabled: false

# Gemspec development dependencies in gemspec vs Gemfile is a project
# convention — disable the cop that enforces moving them to Gemfile.
Gemspec/DevelopmentDependencies:
  Enabled: false

# rubygems MFA is for published gems; this is a path-only dev dependency.
Gemspec/RequireMFA:
  Enabled: false

# The top-level `def client; @client; end` in examples/spec_helper.rb cannot
# use attr_reader because attr_reader is not available on main:Object in
# Ruby 3.2+ outside a class/module context (raises NoMethodError at load time).
Style/TrivialAccessors:
  Enabled: false
