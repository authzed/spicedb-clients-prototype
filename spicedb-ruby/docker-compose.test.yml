services:
  spicedb:
    image: authzed/spicedb:latest
    command: serve --grpc-preshared-key testtoken --datastore-engine memory
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 2s
      timeout: 5s
      retries: 10
