[package]
name = "spicedb"
version = "0.2.0"
edition = "2021"
description = "Idiomatic Rust client for SpiceDB"
license = "Apache-2.0"
repository = "https://github.com/authzed/spicedb-clients"

[dependencies]
# Proto-generated types (path dependency — not yet generated)
spicedb-proto = { path = "../proto-clients/spicedb-rust-proto" }

# gRPC / async
tonic = "0.14"
# google.rpc error details (ErrorInfo) and Status::get_details_error_info --
# tonic's own decoder for the grpc-status-details-bin trailer, used instead of
# decoding that trailer by hand. See root DESIGN.md, "RULE: Error mapping must
# not lose the server's detail".
tonic-types = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# Error handling
thiserror = "2"

# Full-jitter retry backoff
rand = "0.10"

# Serialization (caveat context)
serde_json = "1"

# Timestamps (expiration)
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# In-process mock gRPC servers for integration tests use the generated tonic
# server stubs from spicedb-proto plus a TcpListener-backed incoming stream.
spicedb-proto = { path = "../proto-clients/spicedb-rust-proto" }
tokio-stream = { version = "0.1", features = ["net"] }
# Builds statuses carrying google.rpc.ErrorInfo details, so the error tests
# exercise the same decoding path a real SpiceDB response takes.
tonic-types = "0.14"
