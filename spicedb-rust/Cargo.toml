[package]
name = "spicedb"
version = "0.2.0"
edition = "2021"
description = "Idiomatic Rust client for SpiceDB"
license = "Apache-2.0"
repository = "https://github.com/authzed/spicedb-clients"

[dependencies]
# Proto-generated types (path dependency — not yet generated)
spicedb-proto = { path = "../proto-clients/spicedb-rust-proto" }

# gRPC / async
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# Error handling
thiserror = "2"

# Serialization (caveat context)
serde_json = "1"

# Timestamps (expiration)
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# In-process mock gRPC servers for integration tests use the generated tonic
# server stubs from spicedb-proto plus a TcpListener-backed incoming stream.
spicedb-proto = { path = "../proto-clients/spicedb-rust-proto" }
tokio-stream = { version = "0.1", features = ["net"] }
